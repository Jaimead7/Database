services:
  postgres:
    image: postgres:18
    container_name: postgres
    init: true
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - path: .env.postgres
        required: true
    secrets:
      - pg_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    env_file:
      - path: .env.pgadmin
        required: true
    secrets:
      - pgadmin_password
    networks:
      - db-network


secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt


volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgres_data
    external: false
    labels:
      - "description=PostgreSQL data volume."


networks:
  db-network:
    name: db-network
    driver: bridge
